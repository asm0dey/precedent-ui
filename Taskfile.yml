version: "3"

vars:
  PORT: '{{.PORT | default "8899"}}'

tasks:
  default:
    desc: List the available tasks
    cmds:
      - go-task --list
    silent: true

  install:
    desc: Install both toolchains' dependencies
    cmds:
      - uv sync
      - cd web && bun install

  build:
    desc: Build the frontend into web/dist
    dir: web
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
      - tsconfig*.json
    generates:
      - dist/**/*
    cmds:
      - bun run build

  run:
    desc: Build, then serve the app and API from one process on $PORT
    deps: [build]
    cmds:
      - uv run python -m server.precedent_ui --port {{.PORT}}

  serve:
    desc: Serve whatever is already in web/dist, without rebuilding
    cmds:
      - uv run python -m server.precedent_ui --port {{.PORT}}

  dev:
    desc: Run the API and the Vite dev server together (Vite proxies /api to 8899)
    deps: [dev:api, dev:web]

  dev:api:
    internal: true
    cmds:
      - uv run python -m server.precedent_ui --port 8899

  dev:web:
    internal: true
    dir: web
    cmds:
      - bun run dev

  test:
    desc: Run both test suites
    deps: [test:py, test:web]

  test:py:
    desc: Run the Python test suite
    cmds:
      - uv run pytest -q

  test:web:
    desc: Run the frontend unit tests
    dir: web
    cmds:
      - bun run test

  # `bun run build` is the only real type check here: the solution-style tsconfig
  # means `tsc --noEmit` checks zero files, and vitest transpiles without checking.
  check:
    desc: Everything CI would run — both suites plus the build
    cmds:
      - task: test:py
      - task: test:web
      - task: build
