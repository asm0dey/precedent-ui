sonar.organization=asm0dey
sonar.projectKey=asm0dey_precedent-ui

sonar.sources=server,web/src
sonar.tests=tests,web/src
sonar.test.inclusions=tests/**,web/src/**/*.test.ts,web/src/**/*.test.tsx
sonar.exclusions=web/src/**/*.test.ts,web/src/**/*.test.tsx

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# vitest writes paths relative to web/; CI rewrites them to repo-relative first.
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
